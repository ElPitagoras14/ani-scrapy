name: Publish to PyPI

on:
  push:
    branches:
      - main

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.compare.outputs.version-changed }}
      new-version: ${{ steps.compare.outputs.new-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare version with latest tag
        id: compare
        run: |
          CURRENT=$(grep -E '^version\s*=' pyproject.toml | sed 's/version\s*=\s*"\([^"]*\)"/\1/')
          git fetch --tags
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "new-version=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "version-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "version-changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a changelog entry
        if: ${{ steps.compare.outputs.version-changed == 'true' }}
        run: |
          grep -qx "## ${{ steps.compare.outputs.new-version }}" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## ${{ steps.compare.outputs.new-version }}' heading"
            exit 1
          }

  ci:
    needs: check-version
    if: ${{ needs.check-version.outputs.version-changed == 'true' }}
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check-version, ci]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  release:
    needs: [check-version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract release notes
        run: |
          awk -v v="${{ needs.check-version.outputs.new-version }}" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.check-version.outputs.new-version }}
          git push origin ${{ needs.check-version.outputs.new-version }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-version.outputs.new-version }}
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
