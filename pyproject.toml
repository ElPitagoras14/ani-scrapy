[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ani-scrapy"
version = "0.10.0"
description = "Async-first Python library for scraping anime websites. Supports some anime websites with unified interface, detailed metadata, and download links from multiple servers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "github:ElPitagoras14", email = "jonfrgar@espol.edu.ec" }]
keywords = ["anime", "scraping", "playwright", "async", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "aiohttp>=3.13.0",
  "beautifulsoup4>=4.14.2",
  "loguru>=0.7.3",
  "lxml>=6.0.2",
  "playwright>=1.55.0",
  "playwright-stealth>=2.0.0",
  "rich>=14.3.2",
  "typer>=0.9.0",
]

[project.optional-dependencies]
examples = ["tabulate>=0.9.0"]

[project.scripts]
ani-scrapy = "ani_scrapy.cli:main"

[project.urls]
Homepage = "https://github.com/ElPitagoras14/ani-scrapy"
Repository = "https://github.com/ElPitagoras14/ani-scrapy"
Changelog = "https://github.com/ElPitagoras14/ani-scrapy/blob/main/CHANGELOG.md"
Issues = "https://github.com/ElPitagoras14/ani-scrapy/issues"
Documentation = "https://github.com/ElPitagoras14/ani-scrapy/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "aioresponses>=0.7.9",
    "pytest>=9.0.2",
    "ruff>=0.15.10",
]
